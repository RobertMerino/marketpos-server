<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TITO BURGER · Menú Mesero</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu-mesero.css">
</head>
<body>
    <div class="menu-app">
        
        <!-- HEADER -->
        <div class="header-premium">
            <div class="logo">TITO BURGER</div>
            <div class="sublogo">Hamburguesas al Carbón</div>
            <div class="mesa-info" id="mesaInfo">🔥 MESA 1</div>
        </div>

        <!-- TOP BAR -->
        <div class="top-bar">
            <button onclick="window.location.href='mesero.html'" class="btn-back">← Mesas</button>
            <span class="mesa-badge" id="mesaBadge">🔥 Mesa 1</span>
            <button onclick="goToCart()" class="btn-cart-premium">
                🛒 <span id="cartCount">0</span>
            </button>
        </div>

        <!-- CATEGORÍAS -->
        <div class="categories-premium" id="categoriesContainer"></div>

        <!-- PRODUCTOS -->
        <div class="products-container" id="productsGrid"></div>

        <!-- CARRITO FLOTANTE -->
        <div class="cart-float-premium" id="cartFloat" onclick="goToCart()" style="display:none;">
            <span class="count" id="cartFloatCount">0</span>
            <span>Ver pedido</span>
            <span class="total" id="cartFloatTotal">$0.00</span>
        </div>

        <!-- MODAL CARRITO -->
        <div class="modal-overlay" id="modalCart" style="display:none;">
            <div class="modal-cart">
                <button class="modal-close-btn" onclick="closeCart()">✕</button>
                <h3>🔥 Pedido · Mesa <span id="cartMesaTitle"></span></h3>
                <div id="cartItems"></div>
                <div class="cart-total-premium">
                    <span>TOTAL</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn-confirm-premium" onclick="confirmOrder()">
                    CONFIRMAR PEDIDO
                </button>
            </div>
        </div>
    </div>

    <script src="menu-mesero.js"></script>
</body>
</html>
