<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITO BURGER · Cocina</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #c0392b; --fire-dark: #a93226; --wood: #8b4513; --wood-light: #a0522d;
            --cream: #fdf5e6; --white: #ffffff; --dark: #2c1810; --text: #3d2b1f;
            --text-light: #8b7355; --border: #d4c5b2; --danger: #c0392b; --warning: #e67e22;
            --success: #27ae60; --bg: #f5ebe0; --card: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); min-height: 100vh; padding: 12px; color: var(--text); }
        .kitchen-screen { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; height: 95vh; }
        .kitchen-header { background: linear-gradient(135deg, var(--dark), #3d1e0a); padding: 16px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; flex-wrap: wrap; gap: 12px; border: 1px solid var(--wood); }
        .kitchen-header h1 { font-size: 1.3rem; font-weight: 900; color: var(--fire); letter-spacing: 1px; }
        .kitchen-stats { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-badge { background: rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; text-align: center; border: 1px solid var(--wood-light); transition: all 0.3s; }
        .stat-badge.alerta-retraso { background: rgba(192,57,43,0.3); border-color: var(--fire); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 5px rgba(192,57,43,0.3);} 50%{box-shadow:0 0 20px rgba(192,57,43,0.7);} }
        .stat-number { font-size: 1.4rem; font-weight: 800; display: block; }
        .stat-badge:nth-child(1) .stat-number { color: var(--danger); }
        .stat-badge:nth-child(2) .stat-number { color: var(--warning); }
        .stat-badge:nth-child(3) .stat-number { color: var(--fire); }
        .stat-badge:nth-child(4) .stat-number { color: var(--success); }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: #d4a574; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 12px; overflow-y: auto; flex: 1; padding: 3px; }
        .orders-grid::-webkit-scrollbar { width: 5px; }
        .orders-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .order-card { background: var(--card); border-radius: 8px; padding: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; max-height: 450px; border-left: 4px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s; }
        .order-card.nuevo { border-left-color: var(--danger); }
        .order-card.preparando { border-left-color: var(--warning); }
        .order-card.listo { border-left-color: var(--success); opacity: 0.9; }
        .order-card.retrasado { border-left-color: var(--fire) !important; box-shadow: 0 0 20px rgba(192,57,43,0.3); animation: cardPulse 2s infinite; }
        @keyframes cardPulse { 0%,100%{box-shadow:0 0 10px rgba(192,57,43,0.2);} 50%{box-shadow:0 0 25px rgba(192,57,43,0.5);} }
        .timer-container { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg); border-radius: 4px; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; }
        .timer-container.retrasado { background: #fde8e8; border: 1px solid var(--fire); }
        .timer-container .tiempo-transcurrido { color: #2c1810; }
        .timer-container.retrasado .tiempo-transcurrido { color: var(--fire); }
        .customer-info-mini { font-size: 0.75rem; color: var(--text-light); margin-bottom: 6px; padding: 6px 8px; background: var(--bg); border-radius: 4px; }
        .order-items { list-style: none; margin-bottom: 6px; }
        .order-item { display: flex; justify-content: space-between; padding: 6px 8px; background: var(--bg); border-radius: 4px; margin-bottom: 3px; font-size: 0.8rem; }
        .item-cantidad { background: var(--wood); color: white; padding: 2px 8px; border-radius: 12px; font-weight: 700; font-size: 0.7rem; }
        .order-actions { display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .btn-action { flex: 1; padding: 9px; border: none; border-radius: 4px; font-weight: 700; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
        .btn-action:hover { opacity: 0.85; transform: scale(1.02); }
        .btn-action:active { transform: scale(0.95); }
        .btn-start { background: var(--warning); color: white; }
        .btn-ready { background: var(--success); color: white; }
        .btn-deliver { background: var(--fire); color: white; }
        .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state .emoji { font-size: 4rem; display: block; margin-bottom: 12px; }
        .sound-btn { position:fixed;bottom:20px;right:20px;background:var(--wood);color:white;border:none;width:50px;height:50px;border-radius:50%;font-size:1.5rem;cursor:pointer;z-index:100;box-shadow:0 4px 10px rgba(0,0,0,0.2); }
        .sound-btn:hover { background: var(--wood-light); }
        .alerta-flotante { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--fire); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 700; z-index: 200; animation: slideDown 0.5s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        @keyframes slideDown { from{opacity:0;transform:translateX(-50%) translateY(-20px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
        .badge-retrasado { background: var(--fire); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
        .order-badge { padding: 4px 10px; border-radius: 4px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
        .badge-nuevo { background: var(--danger); color: white; }
        .badge-preparando { background: var(--warning); color: white; }
        .badge-listo { background: var(--success); color: white; }
    </style>
</head>
<body>
    <div class="kitchen-screen">
        <div class="kitchen-header">
            <h1>🔥 TITO BURGER · Cocina</h1>
            <div class="kitchen-stats">
                <div class="stat-badge"><span class="stat-number" id="pendientesCount">0</span><span class="stat-label">Pendientes</span></div>
                <div class="stat-badge"><span class="stat-number" id="preparandoCount">0</span><span class="stat-label">Preparando</span></div>
                <div class="stat-badge" id="retrasadosBadge"><span class="stat-number" id="retrasadosCount">0</span><span class="stat-label">⏰ Retrasados</span></div>
                <div class="stat-badge"><span class="stat-number" id="listosCount">0</span><span class="stat-label">Listos</span></div>
            </div>
        </div>
        <div class="orders-grid" id="ordersGrid"></div>
    </div>
    <button class="sound-btn" onclick="toggleSound()" title="Sonido">🔊</button>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const TIEMPO_LIMITE_SEGUNDOS = 15 * 60; // 15 MINUTOS en segundos
        const DURACION_ALARMA_SEGUNDOS = 15; // Alarma por retraso suena 15 SEGUNDOS
        
        let sonidoActivado = true;
        let alarmasActivas = {};
        let audioContext = null;
        let alarmaIntervalos = {};
        
        // Storage
        let pedidosTimers = {};
        let retrasosNotificados = {};
        let nuevosNotificados = {};
        
        try {
            const savedTimers = localStorage.getItem('cocina_timers_pedidos');
            const savedRetrasos = localStorage.getItem('cocina_retrasos_notificados');
            const savedNuevos = localStorage.getItem('cocina_nuevos_notificados');
            if (savedTimers) pedidosTimers = JSON.parse(savedTimers);
            if (savedRetrasos) retrasosNotificados = JSON.parse(savedRetrasos);
            if (savedNuevos) nuevosNotificados = JSON.parse(savedNuevos);
        } catch(e) {}

        function guardarTimers() {
            localStorage.setItem('cocina_timers_pedidos', JSON.stringify(pedidosTimers));
            localStorage.setItem('cocina_retrasos_notificados', JSON.stringify(retrasosNotificados));
            localStorage.setItem('cocina_nuevos_notificados', JSON.stringify(nuevosNotificados));
        }

        async function getPedidosOnline() {
            try { 
                const res = await fetch('/api/pedidos'); 
                return await res.json();
            } catch(e) { 
                return JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]'); 
            }
        }

        // ==================== SONIDOS ====================
        function detenerAlarma(id) {
            if (alarmaIntervalos[id]) {
                clearInterval(alarmaIntervalos[id]);
                delete alarmaIntervalos[id];
            }
            if (alarmasActivas[id]) {
                clearTimeout(alarmasActivas[id]);
                delete alarmasActivas[id];
            }
            console.log('🔇 Sonido detenido para pedido:', id);
        }

        // Sonido tipo "DING" para nuevo pedido y entrega
        function sonidoDing() {
            if (!sonidoActivado) return;
            
            console.log('🔔 SONIDO DING');
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            try {
                // Nota ascendente tipo "ding" (campana)
                const frequencies = [523.25, 659.25, 783.99]; // Do, Mi, Sol
                
                frequencies.forEach((freq, index) => {
                    setTimeout(() => {
                        const oscillator = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        
                        oscillator.connect(gain);
                        gain.connect(audioContext.destination);
                        
                        oscillator.frequency.value = freq;
                        oscillator.type = 'sine';
                        gain.gain.value = 0.3;
                        
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.3);
                        
                        // Decaimiento suave
                        gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.3);
                    }, index * 100);
                });
            } catch(e) {
                console.log('Error reproduciendo sonido ding:', e);
            }
        }

        // Alarma para retraso (15 segundos con beeps)
        function iniciarAlarmaRetraso(id) {
            if (!sonidoActivado) return;
            if (alarmasActivas[id]) return;
            
            console.log(`🔊 ALARMA RETRASO (15s) - Pedido: ${id}`);
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            let beepCount = 0;
            const inicioAlarma = Date.now();
            
            const intervalo = setInterval(() => {
                const transcurrido = (Date.now() - inicioAlarma) / 1000;
                
                if (transcurrido >= DURACION_ALARMA_SEGUNDOS) {
                    detenerAlarma(id);
                    return;
                }
                
                if (!alarmasActivas[id]) return;
                
                try {
                    const o = audioContext.createOscillator();
                    const g = audioContext.createGain();
                    o.connect(g);
                    g.connect(audioContext.destination);
                    
                    o.frequency.value = beepCount % 2 === 0 ? 880 : 440;
                    o.type = 'square';
                    g.gain.value = 0.4;
                    
                    o.start();
                    o.stop(audioContext.currentTime + 0.15);
                    beepCount++;
                } catch(e) {}
            }, 200);
            
            alarmaIntervalos[id] = intervalo;
            
            const timeout = setTimeout(() => {
                detenerAlarma(id);
            }, DURACION_ALARMA_SEGUNDOS * 1000);
            alarmasActivas[id] = timeout;
        }

        function toggleSound() { 
            sonidoActivado = !sonidoActivado; 
            document.querySelector('.sound-btn').textContent = sonidoActivado ? '🔊' : '🔇'; 
            
            if (!sonidoActivado) {
                Object.keys(alarmaIntervalos).forEach(id => detenerAlarma(id));
            }
        }

        function mostrarAlerta(mensaje) {
            const alerta = document.createElement('div');
            alerta.className = 'alerta-flotante';
            alerta.textContent = mensaje;
            document.body.appendChild(alerta);
            setTimeout(() => {
                alerta.style.opacity = '0';
                setTimeout(() => alerta.remove(), 500);
            }, 4000);
        }

        function calcularTiempoTranscurrido(timestampInicio) {
            const segundosTranscurridos = Math.floor((Date.now() - timestampInicio) / 1000);
            const minutos = Math.floor(segundosTranscurridos / 60);
            const segundos = segundosTranscurridos % 60;
            const retrasado = segundosTranscurridos >= TIEMPO_LIMITE_SEGUNDOS;
            const exceso = Math.max(0, segundosTranscurridos - TIEMPO_LIMITE_SEGUNDOS);
            const excesoMinutos = Math.floor(exceso / 60);
            const excesoSegundos = exceso % 60;
            
            return {
                minutos,
                segundos,
                segundosTranscurridos,
                retrasado,
                exceso,
                excesoMinutos,
                excesoSegundos
            };
        }

        async function cambiarEstado(id, estado) {
            try {
                await fetch('/api/pedidos/' + id, { 
                    method: 'PATCH', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ estado }) 
                });
            } catch(e) {}
            
            const pedidosLocal = JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]');
            const index = pedidosLocal.findIndex(p => String(p.id) === String(id));
            if (index !== -1) {
                pedidosLocal[index].estado = estado;
                localStorage.setItem('marketpos_pedidos_online', JSON.stringify(pedidosLocal));
            }
            
            if (estado === 'listo') {
                detenerAlarma(id);
                mostrarAlerta('✅ ¡Pedido listo para entregar!');
            }
            
            setTimeout(() => renderizar(), 300);
        }

        async function entregarPedido(id) {
            // 🎵 SONIDO DING AL ENTREGAR
            sonidoDing();
            
            detenerAlarma(id);
            
            delete pedidosTimers[id];
            delete retrasosNotificados[id];
            delete nuevosNotificados[id];
            guardarTimers();
            
            try {
                await fetch('/api/pedidos/' + id, { method: 'DELETE' });
            } catch(e) {}
            
            const pedidosLocal = JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]');
            localStorage.setItem('marketpos_pedidos_online', JSON.stringify(pedidosLocal.filter(p => String(p.id) !== String(id))));
            
            mostrarAlerta('🚀 Pedido entregado');
            setTimeout(() => renderizar(), 300);
        }

        function verificarNuevosPedidos(activos) {
            activos.forEach(p => {
                const pid = String(p.id);
                if (p.estado === 'nuevo' && !nuevosNotificados[pid]) {
                    console.log('🆕 NUEVO PEDIDO LLEGÓ A COCINA:', pid);
                    nuevosNotificados[pid] = Date.now();
                    guardarTimers();
                    
                    // 🎵 SOLO SONIDO DING PARA NUEVO PEDIDO (sin PIIII)
                    sonidoDing();
                    
                    mostrarAlerta('🆕 ¡Nuevo pedido en cocina!');
                }
            });
        }

        function verificarRetrasos() {
            Object.keys(pedidosTimers).forEach(id => {
                const timestamp = pedidosTimers[id];
                const tiempo = calcularTiempoTranscurrido(timestamp);
                
                if (tiempo.retrasado && !retrasosNotificados[id]) {
                    console.log('🔴 PEDIDO RETRASADO después de 15 minutos:', id);
                    retrasosNotificados[id] = Date.now();
                    guardarTimers();
                    iniciarAlarmaRetraso(id);
                    mostrarAlerta(`⏰ ¡PEDIDO RETRASADO! +${tiempo.excesoMinutos}:${String(tiempo.excesoSegundos).padStart(2,'0')} min`);
                }
            });
            
            const totalRetrasos = Object.keys(retrasosNotificados).length;
            document.getElementById('retrasadosCount').textContent = totalRetrasos;
            
            if (totalRetrasos > 0) {
                document.getElementById('retrasadosBadge').classList.add('alerta-retraso');
            } else {
                document.getElementById('retrasadosBadge').classList.remove('alerta-retraso');
            }
        }

        async function renderizar() {
            const pedidos = await getPedidosOnline();
            const idsActuales = pedidos.map(p => String(p.id));
            
            Object.keys(pedidosTimers).forEach(id => {
                if (!idsActuales.includes(id)) {
                    detenerAlarma(id);
                    delete pedidosTimers[id];
                    delete retrasosNotificados[id];
                    delete nuevosNotificados[id];
                }
            });
            guardarTimers();
            
            const activos = pedidos.filter(p => ['nuevo', 'preparando', 'listo'].includes(p.estado));
            const grid = document.getElementById('ordersGrid');
            
            verificarNuevosPedidos(activos);
            
            activos.forEach(p => {
                const pid = String(p.id);
                if (!pedidosTimers[pid] && p.estado !== 'listo') {
                    pedidosTimers[pid] = Date.now();
                    console.log('⏱️ Timer iniciado para pedido:', pid);
                    guardarTimers();
                }
            });
            
            document.getElementById('pendientesCount').textContent = activos.filter(p => p.estado === 'nuevo').length;
            document.getElementById('preparandoCount').textContent = activos.filter(p => p.estado === 'preparando').length;
            document.getElementById('listosCount').textContent = activos.filter(p => p.estado === 'listo').length;
            
            if (activos.length === 0) { 
                grid.innerHTML = `<div class="empty-state"><span class="emoji">🍳</span><h2>Cocina en Espera</h2><p>Todos los pedidos están completos</p></div>`; 
                return; 
            }
            
            activos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            
            grid.innerHTML = activos.map(p => {
                const pid = String(p.id);
                const tiempo = calcularTiempoTranscurrido(pedidosTimers[pid] || Date.now());
                const retrasado = tiempo.retrasado && p.estado !== 'listo';
                
                return `
                    <div class="order-card ${retrasado ? 'retrasado' : p.estado}" data-id="${pid}">
                        <div class="order-card-content">
                            <div class="order-card-header">
                                <h3>${p.cliente?.tipoPedido === 'mesa' ? '🪑 Mesa ' + p.cliente?.mesa : '🛵 Delivery'}</h3>
                                ${retrasado ? '<span class="badge-retrasado">⏰ RETRASADO</span>' : `<span class="order-badge badge-${p.estado}">${p.estado.toUpperCase()}</span>`}
                            </div>
                            <div class="timer-container ${retrasado ? 'retrasado' : ''}">
                                <span>⏱️</span>
                                ${retrasado ? 
                                    `<strong class="tiempo-transcurrido" style="color:var(--fire)">⌛ ${tiempo.minutos}:${String(tiempo.segundos).padStart(2,'0')} (${tiempo.excesoMinutos}:${String(tiempo.excesoSegundos).padStart(2,'0')} excedido)</strong>` : 
                                    `<strong class="tiempo-transcurrido">⌛ ${tiempo.minutos}:${String(tiempo.segundos).padStart(2,'0')} transcurrido</strong>`
                                }
                            </div>
                            <div class="customer-info-mini"><span>👤 ${p.cliente?.nombre || 'Cliente'}</span></div>
                            <ul class="order-items">${(p.items || []).map(i => `<li class="order-item"><span>${i.emoji || '🍽️'} ${i.nombre}${i.sabor ? ' (' + i.sabor + ')' : ''}</span><span class="item-cantidad">x${i.cantidad}</span></li>`).join('')}</ul>
                        </div>
                        <div class="order-actions">
                            ${p.estado === 'nuevo' ? `
                                <button class="btn-action btn-start" onclick="cambiarEstado('${pid}','preparando')">▶ Iniciar</button>
                            ` : ''}
                            ${p.estado === 'preparando' ? `
                                <button class="btn-action btn-ready" onclick="cambiarEstado('${pid}','listo')">✅ ¡Listo!</button>
                            ` : ''}
                            ${p.estado === 'listo' ? `
                                <button class="btn-action btn-deliver" onclick="entregarPedido('${pid}')">🚀 Entregar</button>
                            ` : ''}
                        </div>
                    </div>`;
            }).join('');
            
            verificarRetrasos();
        }

        document.addEventListener('click', function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        function actualizarTemporizadores() {
            document.querySelectorAll('.order-card').forEach(card => {
                const id = card.getAttribute('data-id');
                if (id && pedidosTimers[id]) {
                    const tiempo = calcularTiempoTranscurrido(pedidosTimers[id]);
                    const retrasado = tiempo.retrasado;
                    
                    const timerElement = card.querySelector('.timer-container strong');
                    if (timerElement) {
                        if (retrasado) {
                            timerElement.innerHTML = `⌛ ${tiempo.minutos}:${String(tiempo.segundos).padStart(2,'0')} (${tiempo.excesoMinutos}:${String(tiempo.excesoSegundos).padStart(2,'0')} excedido)`;
                            timerElement.style.color = 'var(--fire)';
                        } else {
                            timerElement.innerHTML = `⌛ ${tiempo.minutos}:${String(tiempo.segundos).padStart(2,'0')} transcurrido`;
                            timerElement.style.color = '';
                        }
                    }
                    
                    if (retrasado && !card.classList.contains('retrasado')) {
                        card.classList.add('retrasado');
                        const badgeContainer = card.querySelector('.order-card-header');
                        if (badgeContainer && !card.querySelector('.badge-retrasado')) {
                            const oldBadge = card.querySelector('.order-badge');
                            if (oldBadge) oldBadge.remove();
                            const newBadge = document.createElement('span');
                            newBadge.className = 'badge-retrasado';
                            newBadge.textContent = '⏰ RETRASADO';
                            badgeContainer.appendChild(newBadge);
                        }
                    }
                }
            });
        }
        
        setInterval(actualizarTemporizadores, 1000);
        setInterval(renderizar, 5000);
        renderizar();
    </script>
</body>
</html>
