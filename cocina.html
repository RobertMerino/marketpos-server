<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cocina Pedidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de colores fríos - Diseño profesional */
            --primary: #0f172a;
            --primary-dark: #020617;
            --primary-light: #1e293b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --warning: #f59e0b;
            --warning-dark: #d97706;
            --success: #10b981;
            --success-dark: #059669;
            --info: #06b6d4;
            
            /* Fondos fríos */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-elevated: #334155;
            --bg-light: #f1f5f9;
            
            /* Textos */
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            
            /* Bordes */
            --border: #334155;
            --border-light: #475569;
            
            /* Layout */
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            --transition: all 0.2s ease;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body { 
            background: var(--bg-primary); 
            min-height: 100vh; 
            padding: 16px; 
            color: var(--text-primary); 
        }
        
        .kitchen-screen { 
            max-width: 1600px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            height: 95vh; 
        }
        
        /* Header profesional */
        .kitchen-header { 
            background: linear-gradient(135deg, var(--bg-secondary), var(--primary-dark)); 
            padding: 20px 24px; 
            border-radius: var(--radius-lg); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            flex-shrink: 0; 
            flex-wrap: wrap; 
            gap: 16px; 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow);
        }
        
        .kitchen-header h1 { 
            font-size: 1.4rem; 
            font-weight: 800; 
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }
        
        /* Stats cards frías */
        .kitchen-stats { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
        }
        
        .stat-badge { 
            background: var(--bg-elevated); 
            padding: 12px 20px; 
            border-radius: var(--radius); 
            text-align: center; 
            border: 1px solid var(--border); 
            transition: var(--transition); 
            min-width: 90px;
        }
        
        .stat-badge.alerta-retraso { 
            background: rgba(239, 68, 68, 0.15); 
            border-color: var(--danger); 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0%,100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); } 
            50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 
        }
        
        .stat-number { 
            font-size: 1.6rem; 
            font-weight: 800; 
            display: block; 
            line-height: 1.2;
        }
        
        .stat-badge:nth-child(1) .stat-number { color: var(--danger); }
        .stat-badge:nth-child(2) .stat-number { color: var(--warning); }
        .stat-badge:nth-child(3) .stat-number { color: #f97316; }
        .stat-badge:nth-child(4) .stat-number { color: var(--success); }
        
        .stat-label { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            color: var(--text-muted); 
            font-weight: 600;
            margin-top: 6px;
        }
        
        /* Grid de pedidos */
        .orders-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
            gap: 20px; 
            overflow-y: auto; 
            flex: 1; 
            padding: 4px; 
        }
        
        .orders-grid::-webkit-scrollbar { 
            width: 6px; 
        }
        
        .orders-grid::-webkit-scrollbar-track { 
            background: var(--bg-secondary); 
            border-radius: 4px; 
        }
        
        .orders-grid::-webkit-scrollbar-thumb { 
            background: var(--border); 
            border-radius: 4px; 
        }
        
        /* Tarjetas de pedido */
        .order-card { 
            background: var(--bg-card); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            border: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            max-height: 480px; 
            border-left: 4px solid var(--border); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
            transition: var(--transition); 
        }
        
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border-color: var(--border-light);
        }
        
        .order-card.nuevo { 
            border-left-color: var(--danger); 
        }
        
        .order-card.preparando { 
            border-left-color: var(--warning); 
        }
        
        .order-card.listo { 
            border-left-color: var(--success); 
            opacity: 0.85; 
        }
        
        .order-card.retrasado { 
            border-left-color: var(--danger) !important; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); 
            animation: cardPulse 2s infinite; 
        }
        
        @keyframes cardPulse { 
            0%,100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.15); } 
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); } 
        }
        
        .order-card-content { 
            overflow-y: auto; 
            flex: 1; 
            padding-right: 6px; 
        }
        
        .order-card-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .order-card-content::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 4px;
        }
        
        .order-card-content::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        
        .order-card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 12px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid var(--border); 
            flex-shrink: 0; 
        }
        
        .order-card-header h3 { 
            font-size: 0.95rem; 
            font-weight: 700; 
            color: var(--accent-light); 
        }
        
        .order-badge { 
            padding: 5px 12px; 
            border-radius: 40px; 
            font-size: 0.65rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .badge-nuevo { 
            background: var(--danger); 
            color: white; 
        }
        
        .badge-preparando { 
            background: var(--warning); 
            color: var(--primary-dark); 
        }
        
        .badge-listo { 
            background: var(--success); 
            color: white; 
        }
        
        .badge-retrasado { 
            background: var(--danger); 
            color: white; 
            animation: badgeBlink 0.8s infinite; 
        }
        
        @keyframes badgeBlink { 
            0%,100% { opacity: 1; } 
            50% { opacity: 0.6; } 
        }
        
        /* Timer - estilo frío */
        .timer-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 10px 14px; 
            background: var(--bg-elevated); 
            border-radius: var(--radius); 
            margin-bottom: 12px; 
            font-size: 0.85rem; 
            font-weight: 600; 
        }
        
        .timer-container.retrasado { 
            background: rgba(239, 68, 68, 0.1); 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        
        .timer-label {
            color: var(--text-muted);
            font-size: 0.7rem;
        }
        
        .timer-value {
            font-family: monospace;
            font-size: 1rem;
            font-weight: 700;
        }
        
        .timer-container.retrasado .timer-value { 
            color: var(--danger); 
        }
        
        .timer-exceso {
            color: var(--danger);
            font-size: 0.7rem;
            margin-left: 6px;
        }
        
        /* Info cliente */
        .customer-info-mini { 
            font-size: 0.75rem; 
            color: var(--text-secondary); 
            margin-bottom: 12px; 
            padding: 10px 12px; 
            background: var(--bg-elevated); 
            border-radius: var(--radius); 
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .customer-info-mini span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Items */
        .order-items { 
            list-style: none; 
            margin-bottom: 8px; 
        }
        
        .order-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 12px; 
            background: var(--bg-elevated); 
            border-radius: var(--radius-sm); 
            margin-bottom: 6px; 
            font-size: 0.85rem; 
            transition: var(--transition);
        }
        
        .order-item:hover {
            background: var(--border);
        }
        
        .item-nombre { 
            font-weight: 600; 
            color: var(--text-primary); 
        }
        
        .item-cantidad { 
            background: var(--accent); 
            color: white; 
            padding: 3px 10px; 
            border-radius: 40px; 
            font-weight: 700; 
            font-size: 0.7rem; 
        }
        
        /* Acciones */
        .order-actions { 
            display: flex; 
            gap: 10px; 
            padding-top: 14px; 
            margin-top: 6px;
            border-top: 1px solid var(--border); 
            flex-shrink: 0; 
        }
        
        .btn-action { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: var(--radius); 
            font-weight: 700; 
            font-size: 0.7rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: var(--transition); 
            font-family: inherit;
        }
        
        .btn-action:hover { 
            opacity: 0.9; 
            transform: translateY(-1px); 
        }
        
        .btn-action:active { 
            transform: scale(0.97); 
        }
        
        .btn-start { 
            background: var(--warning); 
            color: var(--primary-dark); 
        }
        
        .btn-ready { 
            background: var(--success); 
            color: white; 
        }
        
        .btn-deliver { 
            background: var(--accent); 
            color: white; 
        }
        
        .btn-reject { 
            background: var(--border); 
            color: var(--text-secondary); 
        }
        
        /* Empty state */
        .empty-state { 
            grid-column: 1/-1; 
            text-align: center; 
            padding: 80px 20px; 
            color: var(--text-muted); 
        }
        
        .empty-state .emoji { 
            font-size: 5rem; 
            display: block; 
            margin-bottom: 16px; 
            opacity: 0.5;
        }
        
        .empty-state h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 0.85rem;
        }
        
        /* Botón de sonido */
        .sound-btn { 
            position: fixed; 
            bottom: 24px; 
            right: 24px; 
            background: var(--bg-elevated); 
            color: var(--text-primary); 
            border: 1px solid var(--border); 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            font-size: 1.4rem; 
            cursor: pointer; 
            z-index: 100; 
            box-shadow: var(--shadow); 
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sound-btn:hover { 
            background: var(--accent); 
            border-color: var(--accent);
            transform: scale(1.05);
        }
        
        /* Alerta flotante */
        .alerta-flotante { 
            position: fixed; 
            top: 24px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--bg-elevated); 
            color: var(--text-primary); 
            padding: 14px 28px; 
            border-radius: 50px; 
            font-weight: 700; 
            font-size: 0.85rem;
            z-index: 200; 
            animation: slideDown 0.4s ease; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
            border-left: 3px solid var(--accent);
            backdrop-filter: blur(8px);
        }
        
        @keyframes slideDown { 
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); } 
            to { opacity: 1; transform: translateX(-50%) translateY(0); } 
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .kitchen-header { flex-direction: column; align-items: stretch; }
            .kitchen-stats { justify-content: center; }
            .orders-grid { grid-template-columns: 1fr; gap: 16px; }
            .order-card { max-height: none; }
        }
    </style>
</head>
<body>
    <div class="kitchen-screen">
        <div class="kitchen-header">
            <h1>❄️ MarketPOS · Cocina Profesional</h1>
            <div class="kitchen-stats">
                <div class="stat-badge"><span class="stat-number" id="pendientesCount">0</span><span class="stat-label">Pendientes</span></div>
                <div class="stat-badge"><span class="stat-number" id="preparandoCount">0</span><span class="stat-label">Preparando</span></div>
                <div class="stat-badge" id="retrasadosBadge"><span class="stat-number" id="retrasadosCount">0</span><span class="stat-label">⏰ Retrasados</span></div>
                <div class="stat-badge"><span class="stat-number" id="listosCount">0</span><span class="stat-label">Listos</span></div>
            </div>
        </div>
        <div class="orders-grid" id="ordersGrid"></div>
    </div>
    <button class="sound-btn" onclick="toggleSound()" title="Activar/Desactivar sonido">🔊</button>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const TIEMPO_LIMITE_SEGUNDOS = 15 * 60; // 15 MINUTOS
        const DURACION_ALARMA_SEGUNDOS = 15;
        
        let sonidoActivado = true;
        let alarmasActivas = {};
        let audioContext = null;
        let alarmaIntervalos = {};
        
        let pedidosTimers = {};
        let retrasosNotificados = {};
        let nuevosNotificados = {};
        
        try {
            const savedTimers = localStorage.getItem('cocina_timers_pedidos');
            const savedRetrasos = localStorage.getItem('cocina_retrasos_notificados');
            const savedNuevos = localStorage.getItem('cocina_nuevos_notificados');
            if (savedTimers) pedidosTimers = JSON.parse(savedTimers);
            if (savedRetrasos) retrasosNotificados = JSON.parse(savedRetrasos);
            if (savedNuevos) nuevosNotificados = JSON.parse(savedNuevos);
        } catch(e) {}

        function guardarTimers() {
            localStorage.setItem('cocina_timers_pedidos', JSON.stringify(pedidosTimers));
            localStorage.setItem('cocina_retrasos_notificados', JSON.stringify(retrasosNotificados));
            localStorage.setItem('cocina_nuevos_notificados', JSON.stringify(nuevosNotificados));
        }

        async function getPedidosOnline() {
            try { 
                const res = await fetch('/api/pedidos'); 
                return await res.json();
            } catch(e) { 
                return JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]'); 
            }
        }

        // ==================== SONIDOS ====================
        function detenerAlarma(id) {
            if (alarmaIntervalos[id]) {
                clearInterval(alarmaIntervalos[id]);
                delete alarmaIntervalos[id];
            }
            if (alarmasActivas[id]) {
                clearTimeout(alarmasActivas[id]);
                delete alarmasActivas[id];
            }
        }

        function sonidoDing() {
            if (!sonidoActivado) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            try {
                const frequencies = [523.25, 659.25, 783.99];
                
                frequencies.forEach((freq, index) => {
                    setTimeout(() => {
                        const oscillator = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        oscillator.connect(gain);
                        gain.connect(audioContext.destination);
                        oscillator.frequency.value = freq;
                        oscillator.type = 'sine';
                        gain.gain.value = 0.25;
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.25);
                        gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.25);
                    }, index * 100);
                });
            } catch(e) {}
        }

        function iniciarAlarmaRetraso(id) {
            if (!sonidoActivado) return;
            if (alarmasActivas[id]) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            let beepCount = 0;
            const inicioAlarma = Date.now();
            
            const intervalo = setInterval(() => {
                const transcurrido = (Date.now() - inicioAlarma) / 1000;
                
                if (transcurrido >= DURACION_ALARMA_SEGUNDOS) {
                    detenerAlarma(id);
                    return;
                }
                
                if (!alarmasActivas[id]) return;
                
                try {
                    const o = audioContext.createOscillator();
                    const g = audioContext.createGain();
                    o.connect(g);
                    g.connect(audioContext.destination);
                    o.frequency.value = beepCount % 2 === 0 ? 880 : 440;
                    o.type = 'square';
                    g.gain.value = 0.3;
                    o.start();
                    o.stop(audioContext.currentTime + 0.15);
                    beepCount++;
                } catch(e) {}
            }, 250);
            
            alarmaIntervalos[id] = intervalo;
            
            const timeout = setTimeout(() => {
                detenerAlarma(id);
            }, DURACION_ALARMA_SEGUNDOS * 1000);
            alarmasActivas[id] = timeout;
        }

        function toggleSound() { 
            sonidoActivado = !sonidoActivado; 
            document.querySelector('.sound-btn').textContent = sonidoActivado ? '🔊' : '🔇'; 
            if (!sonidoActivado) {
                Object.keys(alarmaIntervalos).forEach(id => detenerAlarma(id));
            }
        }

        function mostrarAlerta(mensaje, tipo = 'info') {
            const alerta = document.createElement('div');
            alerta.className = 'alerta-flotante';
            alerta.textContent = mensaje;
            document.body.appendChild(alerta);
            setTimeout(() => {
                alerta.style.opacity = '0';
                setTimeout(() => alerta.remove(), 500);
            }, 4000);
        }

        function calcularTiempoTranscurrido(timestampInicio) {
            const segundosTranscurridos = Math.floor((Date.now() - timestampInicio) / 1000);
            const minutos = Math.floor(segundosTranscurridos / 60);
            const segundos = segundosTranscurridos % 60;
            const retrasado = segundosTranscurridos >= TIEMPO_LIMITE_SEGUNDOS;
            const exceso = Math.max(0, segundosTranscurridos - TIEMPO_LIMITE_SEGUNDOS);
            const excesoMinutos = Math.floor(exceso / 60);
            const excesoSegundos = exceso % 60;
            
            return {
                minutos, segundos, segundosTranscurridos,
                retrasado, exceso, excesoMinutos, excesoSegundos
            };
        }

        async function cambiarEstado(id, estado) {
            try {
                await fetch('/api/pedidos/' + id, { 
                    method: 'PATCH', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ estado }) 
                });
            } catch(e) {}
            
            const pedidosLocal = JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]');
            const index = pedidosLocal.findIndex(p => String(p.id) === String(id));
            if (index !== -1) {
                pedidosLocal[index].estado = estado;
                localStorage.setItem('marketpos_pedidos_online', JSON.stringify(pedidosLocal));
            }
            
            if (estado === 'listo') {
                detenerAlarma(id);
                mostrarAlerta('✅ ¡Pedido listo para entregar!');
            }
            
            setTimeout(() => renderizar(), 300);
        }

        async function entregarPedido(id) {
            sonidoDing();
            detenerAlarma(id);
            
            delete pedidosTimers[id];
            delete retrasosNotificados[id];
            delete nuevosNotificados[id];
            guardarTimers();
            
            try {
                await fetch('/api/pedidos/' + id, { method: 'DELETE' });
            } catch(e) {}
            
            const pedidosLocal = JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]');
            localStorage.setItem('marketpos_pedidos_online', JSON.stringify(pedidosLocal.filter(p => String(p.id) !== String(id))));
            
            mostrarAlerta('🚀 Pedido entregado');
            setTimeout(() => renderizar(), 300);
        }

        async function rechazarPedido(id) {
            if (!confirm('⚠️ ¿Estás seguro de rechazar este pedido?')) return;
            
            detenerAlarma(id);
            delete pedidosTimers[id];
            delete retrasosNotificados[id];
            delete nuevosNotificados[id];
            guardarTimers();
            
            try {
                await fetch('/api/pedidos/' + id, { method: 'DELETE' });
            } catch(e) {}
            
            const pedidosLocal = JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]');
            localStorage.setItem('marketpos_pedidos_online', JSON.stringify(pedidosLocal.filter(p => String(p.id) !== String(id))));
            
            mostrarAlerta('✕ Pedido rechazado');
            setTimeout(() => renderizar(), 300);
        }

        function verificarNuevosPedidos(activos) {
            activos.forEach(p => {
                const pid = String(p.id);
                if (p.estado === 'nuevo' && !nuevosNotificados[pid]) {
                    nuevosNotificados[pid] = Date.now();
                    guardarTimers();
                    sonidoDing();
                    mostrarAlerta('🆕 ¡Nuevo pedido en cocina!');
                }
            });
        }

        function verificarRetrasos() {
            Object.keys(pedidosTimers).forEach(id => {
                const timestamp = pedidosTimers[id];
                const tiempo = calcularTiempoTranscurrido(timestamp);
                
                if (tiempo.retrasado && !retrasosNotificados[id]) {
                    retrasosNotificados[id] = Date.now();
                    guardarTimers();
                    iniciarAlarmaRetraso(id);
                    mostrarAlerta(`⏰ ¡PEDIDO RETRASADO! +${tiempo.excesoMinutos}:${String(tiempo.excesoSegundos).padStart(2,'0')} min`);
                }
            });
            
            const totalRetrasos = Object.keys(retrasosNotificados).length;
            document.getElementById('retrasadosCount').textContent = totalRetrasos;
            
            if (totalRetrasos > 0) {
                document.getElementById('retrasadosBadge').classList.add('alerta-retraso');
            } else {
                document.getElementById('retrasadosBadge').classList.remove('alerta-retraso');
            }
        }

        async function renderizar() {
            const pedidos = await getPedidosOnline();
            const idsActuales = pedidos.map(p => String(p.id));
            
            Object.keys(pedidosTimers).forEach(id => {
                if (!idsActuales.includes(id)) {
                    detenerAlarma(id);
                    delete pedidosTimers[id];
                    delete retrasosNotificados[id];
                    delete nuevosNotificados[id];
                }
            });
            guardarTimers();
            
            const activos = pedidos.filter(p => ['nuevo', 'preparando', 'listo'].includes(p.estado));
            const grid = document.getElementById('ordersGrid');
            
            verificarNuevosPedidos(activos);
            
            activos.forEach(p => {
                const pid = String(p.id);
                if (!pedidosTimers[pid] && p.estado !== 'listo') {
                    pedidosTimers[pid] = Date.now();
                    guardarTimers();
                }
            });
            
            document.getElementById('pendientesCount').textContent = activos.filter(p => p.estado === 'nuevo').length;
            document.getElementById('preparandoCount').textContent = activos.filter(p => p.estado === 'preparando').length;
            document.getElementById('listosCount').textContent = activos.filter(p => p.estado === 'listo').length;
            
            if (activos.length === 0) { 
                grid.innerHTML = `<div class="empty-state"><span class="emoji">❄️🍳</span><h2>Cocina en Espera</h2><p>Todos los pedidos están completados</p></div>`; 
                return; 
            }
            
            activos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            
            grid.innerHTML = activos.map(p => {
                const pid = String(p.id);
                const tiempo = calcularTiempoTranscurrido(pedidosTimers[pid] || Date.now());
                const retrasado = tiempo.retrasado && p.estado !== 'listo';
                
                const itemsHTML = (p.items || []).map(i => `
                    <li class="order-item">
                        <span class="item-nombre">${i.emoji || '🍽️'} ${i.nombre}</span>
                        <span class="item-cantidad">x${i.cantidad}</span>
                    </li>
                `).join('');
                
                return `
                    <div class="order-card ${retrasado ? 'retrasado' : p.estado}" data-id="${pid}">
                        <div class="order-card-content">
                            <div class="order-card-header">
                                <h3>${p.cliente?.tipoPedido === 'mesa' ? '🪑 Mesa ' + p.cliente?.mesa : p.cliente?.tipoPedido === 'delivery' ? '🚀 Delivery' : '🛵 Para Llevar'}</h3>
                                ${retrasado ? '<span class="badge-retrasado">⏰ RETRASADO</span>' : `<span class="order-badge badge-${p.estado}">${p.estado.toUpperCase()}</span>`}
                            </div>
                            <div class="timer-container ${retrasado ? 'retrasado' : ''}">
                                <span class="timer-label">⏱️ Tiempo</span>
                                <div>
                                    <span class="timer-value">${tiempo.minutos}:${String(tiempo.segundos).padStart(2,'0')}</span>
                                    ${retrasado ? `<span class="timer-exceso">(+${tiempo.excesoMinutos}:${String(tiempo.excesoSegundos).padStart(2,'0')})</span>` : ''}
                                </div>
                            </div>
                            <div class="customer-info-mini">
                                <span>👤 ${p.cliente?.nombre || 'Cliente'}</span>
                                ${p.cliente?.telefono ? `<span>📞 ${p.cliente.telefono}</span>` : ''}
                            </div>
                            <ul class="order-items">${itemsHTML}</ul>
                        </div>
                        <div class="order-actions">
                            ${p.estado === 'nuevo' ? `
                                <button class="btn-action btn-start" onclick="cambiarEstado('${pid}','preparando')">▶ Iniciar</button>
                                <button class="btn-action btn-reject" onclick="rechazarPedido('${pid}')">✕ Rechazar</button>
                            ` : ''}
                            ${p.estado === 'preparando' ? `
                                <button class="btn-action btn-ready" onclick="cambiarEstado('${pid}','listo')">✅ Listo</button>
                            ` : ''}
                            ${p.estado === 'listo' ? `
                                <button class="btn-action btn-deliver" onclick="entregarPedido('${pid}')">🚀 Entregar</button>
                            ` : ''}
                        </div>
                    </div>`;
            }).join('');
            
            verificarRetrasos();
        }

        document.addEventListener('click', function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        function actualizarTemporizadores() {
            document.querySelectorAll('.order-card').forEach(card => {
                const id = card.getAttribute('data-id');
                if (id && pedidosTimers[id]) {
                    const tiempo = calcularTiempoTranscurrido(pedidosTimers[id]);
                    const retrasado = tiempo.retrasado;
                    
                    const timerContainer = card.querySelector('.timer-container');
                    const timerValue = card.querySelector('.timer-value');
                    
                    if (timerValue) {
                        timerValue.innerHTML = `${tiempo.minutos}:${String(tiempo.segundos).padStart(2,'0')}`;
                        if (retrasado && timerContainer) {
                            const excesoSpan = timerContainer.querySelector('.timer-exceso');
                            if (excesoSpan) {
                                excesoSpan.textContent = `(+${tiempo.excesoMinutos}:${String(tiempo.excesoSegundos).padStart(2,'0')})`;
                            }
                        }
                    }
                    
                    if (retrasado && !card.classList.contains('retrasado')) {
                        card.classList.add('retrasado');
                        const badgeContainer = card.querySelector('.order-card-header');
                        if (badgeContainer && !card.querySelector('.badge-retrasado')) {
                            const oldBadge = card.querySelector('.order-badge');
                            if (oldBadge) oldBadge.remove();
                            const newBadge = document.createElement('span');
                            newBadge.className = 'badge-retrasado';
                            newBadge.textContent = '⏰ RETRASADO';
                            badgeContainer.appendChild(newBadge);
                        }
                        if (timerContainer) timerContainer.classList.add('retrasado');
                    }
                }
            });
        }
        
        setInterval(actualizarTemporizadores, 1000);
        setInterval(renderizar, 5000);
        renderizar();
    </script>
</body>
</html>
