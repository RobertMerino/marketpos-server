<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TITO BURGER · Mesero</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #ff6b35;
            --fire-dark: #d4380d;
            --coal: #0d0d0d;
            --coal-light: #1a1a1a;
            --ash: #2a2a2a;
            --white: #ffffff;
            --text: #e0e0e0;
            --text-light: #999;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--coal); min-height: 100vh; color: var(--white); }

        .mesero-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: var(--coal); }

        /* HEADER */
        .header { 
            background: linear-gradient(180deg, #050505 0%, #1a1a1a 50%, #2d1a0a 100%);
            padding: 30px 20px 25px;
            text-align: center;
            position: relative;
            border-bottom: 3px solid var(--fire);
        }
        .header::after {
            content: ''; position: absolute; bottom: -12px; left: 0; right: 0;
            height: 25px; background: var(--coal); border-radius: 50% 50% 0 0;
        }
        .header .icon { font-size: 3rem; display: block; margin-bottom: 10px; }
        .header h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; color: var(--white); }
        .header .subtitle { font-size: 0.8rem; color: var(--fire-light); margin-top: 5px; font-weight: 500; }

        /* STATS */
        .stats-row { display: flex; gap: 10px; padding: 25px 15px 15px; }
        .stat-card {
            flex: 1; background: var(--coal-light); border-radius: 6px;
            padding: 16px 12px; text-align: center; border: 1px solid var(--ash);
        }
        .stat-card .stat-num { font-size: 1.8rem; font-weight: 800; }
        .stat-card .stat-label { font-size: 0.65rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
        .stat-card.libre .stat-num { color: var(--success); }
        .stat-card.ocupada .stat-num { color: var(--warning); }
        .stat-card.total .stat-num { color: var(--fire); }

        /* TITLE */
        .section-title {
            padding: 5px 15px 10px; font-size: 0.9rem; font-weight: 700;
            display: flex; align-items: center; gap: 8px; color: var(--text);
        }
        .section-title .dot { width: 8px; height: 8px; background: var(--fire); border-radius: 50%; }

        /* MESAS */
        .mesas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px 15px; }

        .mesa-card {
            background: var(--coal-light); border: 2px solid var(--ash); border-radius: 8px;
            padding: 22px 10px; text-align: center; cursor: pointer;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .mesa-card:hover { transform: translateY(-3px); }
        .mesa-card:active { transform: scale(0.95); }

        .mesa-card.libre {
            border-color: var(--success);
            background: linear-gradient(180deg, #0a2a1a 0%, var(--coal-light) 100%);
        }
        .mesa-card.libre:hover { border-color: #34d399; box-shadow: 0 0 25px rgba(16,185,129,0.2); }

        .mesa-card.ocupada {
            border-color: var(--fire);
            background: linear-gradient(180deg, #2d1a0a 0%, var(--coal-light) 100%);
        }
        .mesa-card.ocupada:hover { border-color: var(--fire-light); box-shadow: 0 0 25px rgba(255,107,53,0.2); }

        .mesa-card .mesa-num { font-size: 2.2rem; font-weight: 800; display: block; letter-spacing: -1px; }
        .mesa-card.libre .mesa-num { color: var(--success); }
        .mesa-card.ocupada .mesa-num { color: var(--fire); }

        .mesa-card .mesa-status {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
            margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .mesa-card.libre .mesa-status { color: var(--success); }
        .mesa-card.ocupada .mesa-status { color: var(--fire); }

        .mesa-card .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .mesa-card.libre .status-dot { background: var(--success); }
        .mesa-card.ocupada .status-dot { background: var(--fire); }

        .mesa-card .mesa-items { font-size: 0.7rem; color: var(--text-light); margin-top: 4px; }

        .mesa-card .mesa-badge {
            position: absolute; top: 8px; right: 8px;
            width: 8px; height: 8px; border-radius: 50%;
        }
        .mesa-card.libre .mesa-badge { background: var(--success); }
        .mesa-card.ocupada .mesa-badge { background: var(--fire); }

        /* TOAST */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; padding: 14px 24px; border-radius: 6px; font-weight: 700;
            z-index: 999; animation: slideDown 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
            font-family: 'Montserrat', sans-serif;
        }
        .toast.error { background: var(--fire); }
        .toast.success { background: var(--success); }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-30px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }

        .refresh-bar { text-align: center; padding: 15px; color: #555; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .refresh-dot { width: 5px; height: 5px; background: var(--fire); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); display: none; align-items: center;
            justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: var(--coal-light); border-radius: 8px; padding: 25px;
            width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--ash);
        }
        .modal-box h3 { color: var(--white); margin-bottom: 12px; font-size: 1.1rem; }
        .modal-box p { color: var(--text-light); margin-bottom: 15px; font-size: 0.9rem; }
        .modal-box .btn { 
            width: 100%; padding: 13px; border-radius: 4px; border: none;
            font-weight: 700; cursor: pointer; margin: 4px 0; font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif; transition: all 0.3s;
        }
        .btn-edit { background: var(--fire); color: white; }
        .btn-edit:hover { background: var(--fire-dark); }
        .btn-new { background: var(--success); color: white; }
        .btn-close-modal { background: var(--ash); color: white; }
    </style>
</head>
<body>
    <div class="mesero-app">
        <div class="header">
            <span class="icon">📱</span>
            <h1>TITO BURGER</h1>
            <p class="subtitle">Tomar Pedido · Mesero</p>
        </div>

        <div class="stats-row">
            <div class="stat-card libre">
                <span class="stat-num" id="countLibres">0</span>
                <span class="stat-label">Libres</span>
            </div>
            <div class="stat-card ocupada">
                <span class="stat-num" id="countOcupadas">0</span>
                <span class="stat-label">Ocupadas</span>
            </div>
            <div class="stat-card total">
                <span class="stat-num" id="countTotal">0</span>
                <span class="stat-label">Total</span>
            </div>
        </div>

        <div class="section-title"><span class="dot"></span> Mesas del Restaurante</div>
        <div class="mesas-grid" id="mesasGrid"></div>

        <div class="refresh-bar"><span class="refresh-dot"></span> Actualización automática</div>
    </div>

    <!-- MODAL MESA OCUPADA -->
    <div class="modal-overlay" id="modalOcupada">
        <div class="modal-box">
            <h3>🔥 Mesa <span id="modalMesaNum"></span> Ocupada</h3>
            <p>¿Qué deseas hacer?</p>
            <button class="btn btn-edit" onclick="editarPedidoModal()">✏️ Editar Pedido</button>
            <button class="btn btn-new" onclick="nuevoPedidoModal()">🆕 Nuevo Pedido</button>
            <button class="btn btn-close-modal" onclick="closeModal()">❌ Cancelar</button>
        </div>
    </div>

    <script>
        const API = '/api/mesas';
        let mesaSeleccionada = null;

        async function cargarMesas() {
            const grid = document.getElementById('mesasGrid');
            try {
                const res = await fetch(API);
                const mesas = await res.json();
                
                document.getElementById('countLibres').textContent = mesas.filter(m => m.estado === 'libre').length;
                document.getElementById('countOcupadas').textContent = mesas.filter(m => m.estado !== 'libre').length;
                document.getElementById('countTotal').textContent = mesas.length;
                
                grid.innerHTML = mesas.map(mesa => {
                    const libre = mesa.estado === 'libre';
                    const itemsCount = mesa.orden?.length || 0;
                    
                    return `
                        <div class="mesa-card ${mesa.estado}" 
                             onclick="${libre ? 'tomarPedido(' + mesa.numero + ')' : 'mostrarOpciones(' + mesa.numero + ')'}">
                            <span class="mesa-badge"></span>
                            <span class="mesa-num">${mesa.numero}</span>
                            <span class="mesa-status">
                                <span class="status-dot"></span>
                                ${libre ? 'Libre' : 'Ocupada'}
                            </span>
                            ${!libre && itemsCount > 0 ? `<span class="mesa-items">${itemsCount} items</span>` : ''}
                        </div>
                    `;
                }).join('');
            } catch(e) {
                grid.innerHTML = '<p style="grid-column:1/-1;color:#ef4444;text-align:center;">Error</p>';
            }
        }

        function tomarPedido(numero) {
            window.location.href = 'menu-mesero.html?mesa=' + numero;
        }
        function editarPedido(numero) {
            window.location.href = 'menu-mesero.html?mesa=' + numero + '&editar=1';
        }
        function mostrarOpciones(numero) {
            mesaSeleccionada = numero;
            document.getElementById('modalMesaNum').textContent = numero;
            document.getElementById('modalOcupada').style.display = 'flex';
        }
        function editarPedidoModal() { closeModal(); editarPedido(mesaSeleccionada); }
        function nuevoPedidoModal() { closeModal(); tomarPedido(mesaSeleccionada); }
        function closeModal() { document.getElementById('modalOcupada').style.display = 'none'; }

        cargarMesas();
        setInterval(cargarMesas, 3000);
    </script>
</body>
</html>
