
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITO BURGER · Cocina</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #c0392b;
            --fire-dark: #a93226;
            --wood: #8b4513;
            --wood-light: #a0522d;
            --cream: #fdf5e6;
            --white: #ffffff;
            --dark: #2c1810;
            --text: #3d2b1f;
            --text-light: #8b7355;
            --border: #d4c5b2;
            --danger: #c0392b;
            --warning: #e67e22;
            --success: #27ae60;
            --bg: #f5ebe0;
            --card: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); min-height: 100vh; padding: 12px; color: var(--text); }
        .kitchen-screen { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; height: 95vh; }
        
        .kitchen-header { 
            background: linear-gradient(135deg, var(--dark), #3d1e0a); 
            padding: 16px 20px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; flex-shrink: 0; flex-wrap: wrap; gap: 12px;
            border: 1px solid var(--wood);
        }
        .kitchen-header h1 { font-size: 1.3rem; font-weight: 900; color: var(--fire); letter-spacing: 1px; }
        .kitchen-stats { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-badge { 
            background: rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; 
            text-align: center; border: 1px solid var(--wood-light);
        }
        .stat-number { font-size: 1.4rem; font-weight: 800; display: block; }
        .stat-badge:nth-child(1) .stat-number { color: var(--danger); }
        .stat-badge:nth-child(2) .stat-number { color: var(--warning); }
        .stat-badge:nth-child(3) .stat-number { color: var(--fire); }
        .stat-badge:nth-child(4) .stat-number { color: var(--success); }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: #d4a574; }

        .orders-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 12px; overflow-y: auto; flex: 1; padding: 3px; 
        }
        .orders-grid::-webkit-scrollbar { width: 5px; }
        .orders-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .order-card { 
            background: var(--card); border-radius: 8px; padding: 16px; 
            border: 1px solid var(--border); display: flex; flex-direction: column; 
            max-height: 450px; border-left: 4px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .order-card.nuevo { border-left-color: var(--danger); }
        .order-card.preparando { border-left-color: var(--warning); }
        .order-card.listo { border-left-color: var(--success); opacity: 0.9; }
        .order-card.retrasado { border-left-color: var(--fire) !important; box-shadow: 0 0 20px rgba(192,57,43,0.3); }

        .order-card-content { overflow-y: auto; flex: 1; padding-right: 3px; }
        .order-card-content::-webkit-scrollbar { width: 3px; }
        .order-card-content::-webkit-scrollbar-thumb { background: var(--border); }

        .order-card-header { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; 
        }
        .order-card-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--dark); }
        .order-badge { 
            padding: 4px 10px; border-radius: 4px; font-size: 0.6rem; 
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }
        .badge-nuevo { background: var(--danger); color: white; }
        .badge-preparando { background: var(--warning); color: white; }
        .badge-listo { background: var(--success); color: white; }
        .badge-retrasado { background: var(--fire); color: white; }

        .timer-container { 
            display: flex; align-items: center; gap: 8px; padding: 6px 10px; 
            background: var(--bg); border-radius: 4px; margin-bottom: 8px; font-size: 0.75rem; 
        }
        .timer-container.retrasado { background: #fde8e8; }
        .customer-info-mini { 
            font-size: 0.75rem; color: var(--text-light); margin-bottom: 6px; 
            padding: 6px 8px; background: var(--bg); border-radius: 4px; 
        }
        .order-items { list-style: none; margin-bottom: 6px; }
        .order-item { 
            display: flex; justify-content: space-between; padding: 6px 8px; 
            background: var(--bg); border-radius: 4px; margin-bottom: 3px; font-size: 0.8rem; 
        }
        .item-cantidad { 
            background: var(--wood); color: white; padding: 2px 8px; 
            border-radius: 12px; font-weight: 700; font-size: 0.7rem; 
        }
        .order-actions { 
            display: flex; gap: 6px; padding-top: 8px; 
            border-top: 1px solid var(--border); flex-shrink: 0; 
        }
        .btn-action { 
            flex: 1; padding: 9px; border: none; border-radius: 4px; 
            font-weight: 700; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 1px; transition: all 0.3s; font-family: 'Montserrat', sans-serif;
        }
        .btn-start { background: var(--warning); color: white; }
        .btn-ready { background: var(--success); color: white; }
        .btn-deliver { background: var(--fire); color: white; }
        .btn-reject { background: #999; color: white; }

        .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state .emoji { font-size: 4rem; display: block; margin-bottom: 12px; }
        
        .sound-btn { position:fixed;bottom:20px;right:20px;background:var(--wood);color:white;border:none;width:50px;height:50px;border-radius:50%;font-size:1.5rem;cursor:pointer;z-index:100;box-shadow:0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="kitchen-screen">
        <div class="kitchen-header">
            <h1>🔥 TITO BURGER · Cocina</h1>
            <div class="kitchen-stats">
                <div class="stat-badge"><span class="stat-number" id="pendientesCount">0</span><span class="stat-label">Pendientes</span></div>
                <div class="stat-badge"><span class="stat-number" id="preparandoCount">0</span><span class="stat-label">Preparando</span></div>
                <div class="stat-badge"><span class="stat-number" id="retrasadosCount">0</span><span class="stat-label">⏰ Retrasados</span></div>
                <div class="stat-badge"><span class="stat-number" id="listosCount">0</span><span class="stat-label">Listos</span></div>
            </div>
        </div>
        <div class="orders-grid" id="ordersGrid"></div>
    </div>
    <button class="sound-btn" onclick="toggleSound()" title="Sonido">🔊</button>

    <script>
        const TIEMPO_LIMITE = 15;
        let sonidoActivado = true;
        let pedidosAnteriores = 0;

        async function getPedidosOnline() {
            try { const res = await fetch('/api/pedidos'); return await res.json(); }
            catch(e) { return JSON.parse(localStorage.getItem('marketpos_pedidos_online') || '[]'); }
        }

        function playSound(tipo) {
            if (!sonidoActivado) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                if (tipo === 'nuevo') { 
                    o.frequency.value = 800; o.type = 'square'; g.gain.value = 0.3; 
                    o.start(); o.stop(audioCtx.currentTime + 0.15);
                    setTimeout(() => {
                        const o2 = audioCtx.createOscillator(); o2.connect(g);
                        o2.frequency.value = 1000; o2.type = 'square';
                        o2.start(); o2.stop(audioCtx.currentTime + 0.15);
                    }, 150);
                } else if (tipo === 'listo') { 
                    o.frequency.value = 523; o.type = 'sine'; g.gain.value = 0.3;
                    o.start(); o.stop(audioCtx.currentTime + 0.2);
                    setTimeout(() => { const o2 = audioCtx.createOscillator(); o2.connect(g); o2.frequency.value = 659; o2.type = 'sine'; o2.start(); o2.stop(audioCtx.currentTime + 0.2); }, 200);
                    setTimeout(() => { const o3 = audioCtx.createOscillator(); o3.connect(g); o3.frequency.value = 784; o3.type = 'sine'; o3.start(); o3.stop(audioCtx.currentTime + 0.3); }, 400);
                } else if (tipo === 'retraso') { 
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => { const oo = audioCtx.createOscillator(); oo.connect(g); oo.frequency.value = 600; oo.type = 'sawtooth'; oo.start(); oo.stop(audioCtx.currentTime + 0.1); }, i * 200);
                    }
                }
            } catch(e) {}
        }

        function toggleSound() { sonidoActivado = !sonidoActivado; document.querySelector('.sound-btn').textContent = sonidoActivado ? '🔊' : '🔇'; }

        function calcularTiempo(f) { const d = new Date() - new Date(f); const min = Math.floor(d / 60000); const seg = Math.floor((d % 60000) / 1000); return { min, seg, retrasado: min >= TIEMPO_LIMITE, retrasoMin: Math.max(0, min - TIEMPO_LIMITE) }; }

        async function cambiarEstado(id, estado) {
            await fetch('/api/pedidos/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado }) }).catch(() => {});
            if (estado === 'listo') playSound('listo');
            renderizar();
        }

        async function entregarPedido(id) {
            try {
                const res = await fetch('/api/pedidos'); const todos = await res.json();
                const pedido = todos.find(p => p.id === id);
                if (pedido?.cliente?.mesa) {
                    const mesas = JSON.parse(localStorage.getItem('marketpos_mesas') || '[]');
                    const mesa = mesas.find(m => m.numero === parseInt(pedido.cliente.mesa));
                    if (mesa) { mesa.estado = 'libre'; mesa.orden = []; }
                    localStorage.setItem('marketpos_mesas', JSON.stringify(mesas));
                }
            } catch(e) {}
            await fetch('/api/pedidos/' + id, { method: 'DELETE' }).catch(() => {});
            renderizar();
        }

        function actualizarTemporizadores() {
            document.querySelectorAll('.order-card').forEach(card => {
                const timerEl = card.querySelector('.timer-minutes');
                const fechaAttr = card.getAttribute('data-fecha');
                if (timerEl && fechaAttr) { const t = calcularTiempo(fechaAttr); timerEl.textContent = `${t.min}:${String(t.seg).padStart(2, '0')}`; }
            });
        }

        async function renderizar() {
            const pedidos = await getPedidosOnline();
            const activos = pedidos.filter(p => ['nuevo', 'preparando', 'listo'].includes(p.estado));
            const grid = document.getElementById('ordersGrid');
            if (activos.length > pedidosAnteriores) playSound('nuevo');
            pedidosAnteriores = activos.length;
            document.getElementById('pendientesCount').textContent = activos.filter(p => p.estado === 'nuevo').length;
            document.getElementById('preparandoCount').textContent = activos.filter(p => p.estado === 'preparando').length;
            document.getElementById('listosCount').textContent = activos.filter(p => p.estado === 'listo').length;
            let retrasados = 0;
            activos.forEach(p => { if (p.estado !== 'listo' && calcularTiempo(p.fecha).retrasado) { retrasados++; playSound('retraso'); } });
            document.getElementById('retrasadosCount').textContent = retrasados;
            if (activos.length === 0) { grid.innerHTML = `<div class="empty-state"><span class="emoji">🍳</span><h2>Cocina en Espera</h2></div>`; return; }
            activos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            grid.innerHTML = activos.map(p => {
                const t = calcularTiempo(p.fecha);
                const ret = t.retrasado && p.estado !== 'listo';
                const tipoTexto = (p.cliente?.tipoPedido || 'mesa') === 'mesa' ? '🪑 Mesa ' + p.cliente?.mesa : '🛵 Recoger';
                return `
                    <div class="order-card ${ret ? 'retrasado' : p.estado}" data-fecha="${p.fecha}">
                        <div class="order-card-content">
                            <div class="order-card-header"><h3>${tipoTexto}</h3><span class="order-badge ${ret ? 'badge-retrasado' : 'badge-' + p.estado}">${ret ? '⏰ RETRASADO' : p.estado.toUpperCase()}</span></div>
                            <div class="timer-container ${ret ? 'retrasado' : ''}"><span>⏱️</span> <span class="timer-text"><strong class="timer-minutes">${t.min}:${String(t.seg).padStart(2,'0')}</strong> min</span>${ret ? `<span style="color:var(--fire);margin-left:auto;">+${t.retrasoMin} min</span>` : ''}</div>
                            <div class="customer-info-mini"><span>👤 ${p.cliente?.nombre || 'Cliente'}</span></div>
                            <ul class="order-items">${(p.items || []).map(i => `<li class="order-item"><span>${i.emoji || '🍽️'} ${i.nombre}</span><span class="item-cantidad">x${i.cantidad}</span></li>`).join('')}</ul>
                        </div>
                        <div class="order-actions">
                            ${p.estado === 'nuevo' ? `<button class="btn-action btn-start" onclick="cambiarEstado('${p.id}','preparando')">Iniciar</button><button class="btn-action btn-reject" onclick="entregarPedido('${p.id}')">Rechazar</button>` : ''}
                            ${p.estado === 'preparando' ? `<button class="btn-action btn-ready" onclick="cambiarEstado('${p.id}','listo')">¡Listo!</button>` : ''}
                            ${p.estado === 'listo' ? `<button class="btn-action btn-deliver" onclick="entregarPedido('${p.id}')">Entregado</button>` : ''}
                        </div>
                    </div>`;
            }).join('');
        }

        setInterval(actualizarTemporizadores, 1000);
        setInterval(renderizar, 3000);
        renderizar();
    </script>
</body>
</html>
