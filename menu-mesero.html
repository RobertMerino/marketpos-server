<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0a">
    <title>TITO BURGER · Menú Mesero</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu-mesero.css">
</head>
<body>
    <div class="menu-app">
        
        <!-- HEADER -->
        <div class="header-premium">
            <div class="logo">TITO BURGER</div>
            <div class="sublogo">Hamburguesas al Carbón</div>
            <div class="mesa-info" id="mesaInfo">🔥 MESA 1</div>
        </div>

        <!-- TOP BAR -->
        <div class="top-bar">
            <button onclick="window.location.href='mesero.html'" class="btn-back">← Mesas</button>
            <span class="mesa-badge" id="mesaBadge">🔥 Mesa 1</span>
            <button onclick="goToCart()" class="btn-cart-premium">
                🛒 <span id="cartCount">0</span>
            </button>
        </div>

        <!-- CATEGORÍAS - ESTILO MENU DIGITAL -->
        <div class="categories-premium" id="categoriesContainer"></div>

        <!-- PRODUCTOS - ESTILO MENU DIGITAL -->
        <div class="menu-grid" id="productsGrid"></div>

        <!-- CARRITO FLOTANTE -->
        <div class="cart-float-premium" id="cartFloat" onclick="goToCart()" style="display:none;">
            <span class="count" id="cartFloatCount">0</span>
            <span>Ver pedido</span>
            <span class="total" id="cartFloatTotal">$0.00</span>
        </div>

        <!-- MODAL CARRITO -->
        <div class="modal-overlay" id="modalCart" style="display:none;">
            <div class="modal-cart">
                <button class="modal-close-btn" onclick="closeCart()">✕</button>
                <h3>🔥 Pedido · Mesa <span id="cartMesaTitle"></span></h3>
                <div id="cartItems"></div>
                <div class="cart-total-premium">
                    <span>TOTAL</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn-confirm-premium" onclick="confirmOrder()">
                    CONFIRMAR PEDIDO
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL SABORES - ESTILO MENU DIGITAL          -->
    <!-- ============================================ -->
    <div class="modal-sabores" id="modalSabores" style="display:none;">
        <div class="modal-sabores-content">
            <div class="modal-header">
                <h3>🍗 Selecciona los sabores</h3>
                <button class="close-modal" onclick="closeSaborModal()">&times;</button>
            </div>
            <div class="sabores-info" id="saboresInfo"></div>
            <div class="sabores-grid" id="saboresGrid">
                <div class="sabor-card" data-sabor="BBQ" data-id="1">
                    <span class="sabor-emoji">🍖</span>
                    <span class="sabor-nombre">BBQ</span>
                    <span class="sabor-check">✓</span>
                </div>
                <div class="sabor-card" data-sabor="BBQ Picante" data-id="2">
                    <span class="sabor-emoji">🌶️</span>
                    <span class="sabor-nombre">BBQ Picante</span>
                    <span class="sabor-check">✓</span>
                </div>
                <div class="sabor-card" data-sabor="Mostaza y Miel" data-id="3">
                    <span class="sabor-emoji">🍯</span>
                    <span class="sabor-nombre">Mostaza y Miel</span>
                    <span class="sabor-check">✓</span>
                </div>
                <div class="sabor-card" data-sabor="Maracuyá" data-id="4">
                    <span class="sabor-emoji">🥭</span>
                    <span class="sabor-nombre">Maracuyá</span>
                    <span class="sabor-check">✓</span>
                </div>
                <div class="sabor-card" data-sabor="Parmesano" data-id="5">
                    <span class="sabor-emoji">🧀</span>
                    <span class="sabor-nombre">Parmesano</span>
                    <span class="sabor-check">✓</span>
                </div>
            </div>
            <div class="selected-sabores" id="selectedSaboresContainer">
                <label>📋 Sabores seleccionados:</label>
                <div id="selectedSaboresList"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="closeSaborModal()">Cancelar</button>
                <button class="btn-aceptar" onclick="confirmarSabores()">Aceptar ✓</button>
            </div>
        </div>
    </div>

    <script src="menu-mesero.js"></script>
</body>
</html>
