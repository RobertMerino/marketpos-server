<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>La Buena Mesa · Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a96e;
            --gold-light: #e0c78a;
            --dark: #1a1814;
            --darker: #0d0b08;
            --cream: #faf7f2;
            --white: #ffffff;
            --text: #3d3929;
            --border: #e5d5b0;
            --danger: #8b1a1a;
            --success: #2d5a27;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
        }
        .menu-app { max-width: 480px; margin: 0 auto; background: var(--cream); min-height: 100vh; }
        
        /* HEADER PREMIUM */
        .header-premium {
            background: linear-gradient(180deg, var(--dark) 0%, #2a2418 100%);
            padding: 40px 20px 30px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid var(--gold);
        }
        .header-premium::before {
            content: '◆ ◆ ◆';
            color: var(--gold);
            font-size: 0.6rem;
            letter-spacing: 10px;
            display: block;
            margin-bottom: 15px;
            opacity: 0.8;
        }
        .header-premium .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--gold);
            letter-spacing: 3px;
            font-weight: 600;
        }
        .header-premium .sublogo {
            font-size: 0.6rem;
            color: var(--gold-light);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .header-premium .mesa-info {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            border: 1px solid var(--gold);
            border-radius: 3px;
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* TOP BAR */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; background: var(--white);
            border-bottom: 1px solid var(--border);
        }
        .btn-back {
            background: none; border: none; color: var(--text);
            font-size: 0.85rem; cursor: pointer; font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }
        .btn-cart-premium {
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
        }
        
        /* CATEGORÍAS */
        .categories-premium {
            display: flex; gap: 5px; padding: 15px; overflow-x: auto;
            background: var(--white); border-bottom: 1px solid var(--border);
        }
        .categories-premium::-webkit-scrollbar { display: none; }
        .cat-item {
            padding: 10px 16px; background: transparent; border: 1px solid var(--border);
            color: var(--text); font-size: 0.7rem; font-weight: 500;
            white-space: nowrap; cursor: pointer; transition: all 0.3s;
            letter-spacing: 1px; text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }
        .cat-item.active {
            background: var(--dark); color: var(--gold); border-color: var(--dark);
        }
        
        /* PRODUCTOS */
        .products-container { padding: 15px; }
        .product-card-premium {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--white); padding: 16px 18px; margin-bottom: 8px;
            border-left: 3px solid transparent; cursor: pointer;
            transition: all 0.3s;
        }
        .product-card-premium:hover { border-left-color: var(--gold); background: #fdfaf5; }
        .product-card-premium:active { transform: scale(0.99); }
        .product-info { flex: 1; }
        .product-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem; font-weight: 600; color: var(--text);
        }
        .product-desc {
            font-size: 0.7rem; color: #999; margin-top: 2px;
            font-style: italic;
        }
        .product-price {
            font-weight: 700; color: var(--gold); font-size: 1.1rem;
            font-family: 'Cormorant Garamond', serif;
        }
        .btn-add {
            background: var(--dark); color: var(--gold); border: none;
            width: 34px; height: 34px; font-size: 1.2rem; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
            margin-left: 12px;
        }
        .btn-add:active { background: var(--gold); color: var(--dark); }
        
        /* CARRITO FLOTANTE */
        .cart-float-premium {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--dark); color: var(--gold); padding: 14px 24px;
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); z-index: 20;
            border: 1px solid var(--gold);
        }
        .cart-float-premium .count {
            background: var(--gold); color: var(--dark);
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700;
        }
        .cart-float-premium .total {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem; font-weight: 700;
        }
        
        /* MODAL CARRITO */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex; align-items: flex-end;
            justify-content: center; z-index: 100;
        }
        .modal-cart {
            background: var(--white); width: 100%; max-width: 480px;
            max-height: 75vh; overflow-y: auto; padding: 25px 20px;
        }
        .modal-cart h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem; text-align: center; margin-bottom: 20px;
            color: var(--dark); letter-spacing: 2px;
        }
        .cart-item-premium {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .cart-total-premium {
            display: flex; justify-content: space-between;
            font-size: 1.3rem; font-weight: 700; margin: 20px 0;
            padding-top: 15px; border-top: 2px solid var(--dark);
            font-family: 'Cormorant Garamond', serif;
        }
        .btn-confirm-premium {
            width: 100%; padding: 16px; background: var(--dark);
            color: var(--gold); border: 1px solid var(--gold);
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            letter-spacing: 3px; text-transform: uppercase;
            font-family: 'Montserrat', sans-serif; transition: all 0.3s;
        }
        .btn-confirm-premium:hover { background: var(--gold); color: var(--dark); }
        .btn-close {
            position: absolute; top: 10px; right: 15px;
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
            color: var(--text);
        }
        .btn-qty {
            width: 28px; height: 28px; border: 1px solid var(--border);
            background: white; cursor: pointer; font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body>
    <div class="menu-app">
        <div class="header-premium">
            <div class="logo">LA BUENA MESA</div>
            <div class="sublogo">Cocina de Autor</div>
            <div class="mesa-info" id="mesaInfo">🪑 MESA 1</div>
        </div>

        <div class="top-bar">
            <button onclick="window.location.href='mesero.html'" class="btn-back">← Mesas</button>
            <button onclick="goToCart()" class="btn-cart-premium">
                🛒 Pedido · <span id="cartCount">0</span>
            </button>
        </div>

        <div class="categories-premium" id="categoriesContainer"></div>
        <div class="products-container" id="productsGrid"></div>

        <div class="cart-float-premium" id="cartFloat" onclick="goToCart()" style="display:none;">
            <span class="count" id="cartFloatCount">0</span>
            <span>Ver pedido</span>
            <span class="total" id="cartFloatTotal">$0.00</span>
        </div>

        <div class="modal-overlay" id="modalCart" style="display:none;">
            <div class="modal-cart" style="position:relative;">
    <button onclick="closeCart()" style="position:absolute;top:15px;right:15px;background:var(--dark);color:var(--gold);border:none;width:32px;height:32px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
    <h3>🛒 Pedido · Mesa <span id="cartMesaTitle"></span></h3>
                <div id="cartItems"></div>
                <div class="cart-total-premium">
                    <span>TOTAL</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn-confirm-premium" onclick="confirmOrder()">
                    Confirmar Pedido
                </button>
            </div>
        </div>
    </div>

    <script src="menu-mesero.js"></script>
</body>
</html>
